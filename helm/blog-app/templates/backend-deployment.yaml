apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-app-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: blog-app-backend
    app.kubernetes.io/part-of: blog-app
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app.kubernetes.io/name: blog-app-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blog-app-backend
        app.kubernetes.io/part-of: blog-app
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for blog-app-db:{{ .Values.db.port }}..."
              until nc -z blog-app-db {{ .Values.db.port }}; do
                sleep 3
              done
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: DB_HOST
              value: "blog-app-db"
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: blog-app-db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: blog-app-db-secret
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: blog-app-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: {{ .Values.resources.backend.requests.cpu }}
              memory: {{ .Values.resources.backend.requests.memory }}
            limits:
              cpu: {{ .Values.resources.backend.limits.cpu }}
              memory: {{ .Values.resources.backend.limits.memory }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: {{ .Values.backend.port }}
