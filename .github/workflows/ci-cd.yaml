name: Blog App DevSecOps Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

env:
  DOCKER_REGISTRY: docker.io
  BACKEND_IMAGE: docker.io/amanpandey3956/blog-app-backend
  FRONTEND_IMAGE: docker.io/amanpandey3956/blog-app-frontend

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: "Lint Code"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - run: npm ci
        working-directory: ${{ matrix.component }}

      - run: npm run lint
        working-directory: ${{ matrix.component }}

  sca:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "${{ matrix.component }}/package-lock.json"

      - run: npm ci
        working-directory: ${{ matrix.component }}

      - run: npm audit --audit-level=high || true
        working-directory: ${{ matrix.component }}

  build:
    name: "Build & Push ${{ matrix.component }}"
    runs-on: ubuntu-latest
    needs: sca
    permissions:
      contents: read
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ matrix.component == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ matrix.component == 'backend' && env.BACKEND_IMAGE || env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

  image-scan:
    name: "Scan Image"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: |
          docker build -t blogapp-${{ matrix.component }}:scan ./${{ matrix.component }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "blogapp-${{ matrix.component }}:scan"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  iac-scan:
    name: "IaC Scan (Helm chart)"
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Helm chart scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: helm/
          framework: helm
          soft_fail: true

  dockerfile-lint:
    name: "Dockerfile Lint"
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: error

  update-manifest:
    name: "Bump Helm values (GitOps trigger)"
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build, image-scan]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump image tags in Helm values.yaml
        run: |
          TAG=${{ github.sha }}
          yq -i ".image.backend.tag = \"${TAG}\"" helm/blog-app/values.yaml
          yq -i ".image.frontend.tag = \"${TAG}\"" helm/blog-app/values.yaml

          echo "Updated image tags:"
          yq '.image.backend.tag, .image.frontend.tag' helm/blog-app/values.yaml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add helm/blog-app/values.yaml
          git commit -m "ci: bump image tag to ${{ github.sha }} [skip ci]" || echo "No changes"
          git push